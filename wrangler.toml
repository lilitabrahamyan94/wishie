# Cloudflare Worker settings for the product lookup backend (backend/worker.js).
# The name must match the Worker's name in the Cloudflare dashboard.
name = "wishlist"
main = "backend/worker.js"
compatibility_date = "2026-06-01"

# Re-checks prices for price drop alerts every 6 hours.
[triggers]
crons = ["0 */6 * * *"]

# Storage for price drop alerts (KV namespace "ALERTS").
[[kv_namespaces]]
binding = "ALERTS"
id = "ac4c3c5b8d8f448687bbc6f2b7c56851"
